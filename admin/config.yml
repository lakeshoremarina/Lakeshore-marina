backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"
publish_mode: simple
site_url: "https://lakeshoremarina.org"
display_url: "https://lakeshoremarina.org"
logo_url: "/logos/marina-logo.png"

collections:
  - name: "website"
    label: "Website Settings"
    files:
      - name: "site_settings"
        label: "Website Settings"
        file: "data/site-settings.json"
        format: "json"
        fields:
          - label: "Homepage Announcement"
            name: "announcement"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Show Announcement", name: "enabled", widget: "boolean", default: false, hint: "Turn this on to display an important message across the top of the homepage." }
              - { label: "Announcement Message", name: "text", widget: "string", required: false, hint: "Example: Spring launch specials are available now. Call for details." }
          - label: "Homepage Text"
            name: "homepage"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Main Intro", name: "hero_description", widget: "text" }
              - { label: "Rentals Heading", name: "rentals_heading", widget: "string" }
              - { label: "Rentals Description", name: "rentals_description", widget: "text" }
              - { label: "About Heading", name: "about_heading", widget: "string" }
              - { label: "About Paragraph 1", name: "about_paragraph_one", widget: "text" }
              - { label: "About Paragraph 2", name: "about_paragraph_two", widget: "text" }
          - label: "Contact Information"
            name: "contact"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Phone Number as Displayed", name: "phone_display", widget: "string", hint: "Example: 419-268-2280" }
              - { label: "Phone Number for Click-to-Call", name: "phone_link", widget: "string", hint: "Numbers only. Example: 4192682280" }
              - { label: "Email Address", name: "email", widget: "string" }
              - { label: "Street Address", name: "address", widget: "string" }
              - { label: "Facebook Page URL", name: "facebook_url", widget: "string" }
              - { label: "Facebook Name", name: "facebook_handle", widget: "string", hint: "Example: @lakeshoregrandlake" }
          - label: "Business Hours"
            name: "hours"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Monday", name: "monday", widget: "string" }
              - { label: "Tuesday", name: "tuesday", widget: "string" }
              - { label: "Wednesday", name: "wednesday", widget: "string" }
              - { label: "Thursday", name: "thursday", widget: "string" }
              - { label: "Friday", name: "friday", widget: "string" }
              - { label: "Saturday", name: "saturday", widget: "string" }
              - { label: "Sunday", name: "sunday", widget: "string" }
              - { label: "Footer Weekday Summary", name: "footer_weekdays", widget: "string", hint: "Example: Mon–Sat: 9:00 AM – 5:00 PM" }
              - { label: "Footer Sunday Summary", name: "footer_sunday", widget: "string", hint: "Example: Sunday: 12:00 PM – 3:00 PM" }
          - label: "Rental Prices"
            name: "rentals"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Full Day Price", name: "full_day_price", widget: "string", hint: "Example: $275" }
              - { label: "Overnight Price", name: "overnight_price", widget: "string", hint: "Example: $350" }
              - { label: "Tube Rental Price", name: "tube_price", widget: "string", hint: "Example: $25" }

  - name: "inventory"
    label: "Boat Inventory"
    files:
      - name: "boats"
        label: "Boats for Sale"
        file: "data/boats.json"
        format: "json"
        fields:
          - label: "Boat Listings"
            name: "boats"
            widget: "list"
            summary: "{{fields.year}} {{fields.make}} {{fields.model}} — {{fields.status}}"
            fields:
              - { label: "Listing Title", name: "title", widget: "string", hint: "Example: 2024 Bentley Legacy 223" }
              - { label: "Year", name: "year", widget: "number", value_type: "int", min: 1950, max: 2100 }
              - { label: "Make / Brand", name: "make", widget: "select", options: ["Bentley", "Harris", "Trifecta", "Dockside", "Other"] }
              - { label: "Model", name: "model", widget: "string" }
              - { label: "Condition", name: "condition", widget: "select", options: ["New", "Pre-Owned"] }
              - { label: "Status", name: "status", widget: "select", options: ["Available", "Sale Pending", "Sold"], default: "Available" }
              - { label: "Price", name: "price", widget: "number", value_type: "int", required: false, hint: "Leave blank to show Call for price" }
              - { label: "Length", name: "length", widget: "string", required: false, hint: "Example: 22 ft 3 in" }
              - { label: "Engine", name: "engine", widget: "string", required: false, hint: "Example: Mercury 150 HP" }
              - { label: "Engine Hours", name: "hours", widget: "string", required: false }
              - { label: "Stock Number", name: "stock_number", widget: "string", required: false }
              - { label: "Main Photo", name: "cover_image", widget: "image", required: true, hint: "This is the photo customers see first. On a phone, choose Camera or Photo Library." }
              - label: "Additional Photos"
                name: "gallery"
                widget: "list"
                required: false
                hint: "Add as many detail photos as needed."
                field: { label: "Photo", name: "photo", widget: "image" }
              - { label: "Description", name: "description", widget: "text", required: false }
